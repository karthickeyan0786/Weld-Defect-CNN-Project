model_name: "Model A (Baseline CNN)"
project:
  seed: 42
  data_dir: "./data"
  extracted_dir: "./data/RIAWELC_extracted"
  split_dir: "./data/RIAWELC_split"
  output_dir: "./outputs"

dataset:
  classes: ['CR', 'PO', 'LP', 'ND']
  target_size: [224, 224]
  train_split: 0.65
  val_split: 0.25
  test_split: 0.10

preprocessing:
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]

augmentation:
  rotation_degrees: 10
  translate_fraction: 0.05
  p_horizontal_flip: 0.5
  p_vertical_flip: 0.5

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  patience: 10
  optimizer: "Adam"