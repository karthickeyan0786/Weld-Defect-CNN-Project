model_name: "Model C (EfficientNet-B0)"
project:
  seed: 42
  split_dir: "./data/RIAWELC_split"
  output_dir: "./outputs/model_c"

dataset:
  classes: ['CR', 'PO', 'LP', 'ND']
  target_size: [224, 224]

preprocessing:
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]

augmentation:
  rotation_degrees: 10
  translate_fraction: 0.05
  p_horizontal_flip: 0.5
  p_vertical_flip: 0.5

training:
  batch_size: 32
  stage1_lr: 0.001
  stage1_epochs: 10
  stage2_lr: 0.0001
  stage2_epochs: 40
  patience: 10
  optimizer: "AdamW"
  dropout: 0.5